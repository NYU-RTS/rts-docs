# .github/workflows/deploy.yml
name: Deploy
on:
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Pinned below 11.12.0, whose self-install crashes with
          # "Cannot use 'in' operator to search for 'integrity' in undefined".
          # https://github.com/pnpm/action-setup/issues/276
          # https://github.com/pnpm/pnpm/issues/12959
          version: 11.11.0

      - name: Install and Build
        run: |
          pnpm install --prod --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: build
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
