name: Vale Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  
jobs:
  vale:
    name: Vale Grammar and Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.12.0
          files: '["docs/", "src/pages/"]'
          reporter: github-pr-review
