# Internal links are already checked by the Docusaurus build
# (onBrokenLinks: "throw" in docusaurus.config.ts), so this only
# needs to cover external URLs.
name: Link checker

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1" # weekly: external links rot without any commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            './docs/**/*.md' './docs/**/*.mdx'
            './blog/**/*.md' './blog/**/*.mdx'
          # External links are flaky, so only the scheduled/manual runs fail;
          # PRs report results in the job summary without blocking.
          fail: ${{ github.event_name != 'pull_request' }}
          jobSummary: true
